services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speaking_lab}
      POSTGRES_USER: ${POSTGRES_USER:-speaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speaking_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-speaking} -d ${POSTGRES_DB:-speaking_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
      args:
        DEBIAN_MIRROR_HOST: ${DEBIAN_MIRROR_HOST:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://speaking:speaking_local@postgres:5432/speaking_lab}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-now}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-cn-beijing}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_BUCKET_DOMAIN: ${OSS_BUCKET_DOMAIN:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_RECORDING_PREFIX: ${OSS_RECORDING_PREFIX:-recordings}
      OSS_TEST_PREFIX: ${OSS_TEST_PREFIX:-connectivity-tests}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then python -m app.db.seed; fi && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
