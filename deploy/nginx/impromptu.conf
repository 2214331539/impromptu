# Impromptu 生产站点（系统 nginx，Ubuntu conf.d 布局）
# 作用：对外开放 80/443，反向代理到 Docker 前端容器（127.0.0.1:18090）
# 证书：certbot 自动签发与续期（/etc/letsencrypt/live/impromptu.com.cn/）

# HTTP：301 跳转到 HTTPS（www 统一跳转到主域名）
server {
    listen 80;
    listen [::]:80;
    server_name impromptu.com.cn www.impromptu.com.cn;

    # Let's Encrypt http-01 续期验证兜底（日常由 certbot nginx 插件接管）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://impromptu.com.cn$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name impromptu.com.cn www.impromptu.com.cn;

    # www 统一跳转到主域名（证书包含 www 后生效）
    if ($host = www.impromptu.com.cn) {
        return 301 https://impromptu.com.cn$request_uri;
    }

    ssl_certificate         /etc/letsencrypt/live/impromptu.com.cn/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/impromptu.com.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/impromptu.com.cn/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
